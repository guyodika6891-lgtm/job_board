{% extends "base.html" %}

{% block title %}Post a Job{% endblock %}

{% block content %}
    <div class="row justify-content-center">
        <div class="col-md-9">
            <div class="text-center mb-4">
                <div style="font-size: 3rem;">💼</div>
                <h2 class="fw-bold mt-2">Post a New Job</h2>
                <p class="text-muted">Reach thousands of qualified candidates</p>
            </div>

            <form method="POST">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="title" class="form-label"><i class="fas fa-heading me-1 text-primary"></i> Job Title *</label>
                        <input type="text" class="form-control" id="title" name="title" value="{{ title or '' }}" placeholder="e.g., Senior Python Developer" required>
                    </div>
                    <div class="col-md-6">
                        <label for="company" class="form-label"><i class="fas fa-building me-1 text-primary"></i> Company *</label>
                        <input type="text" class="form-control" id="company" name="company" value="{{ company or '' }}" placeholder="Company name" required>
                    </div>
                    <div class="col-md-6">
                        <label for="location" class="form-label"><i class="fas fa-map-marker-alt me-1 text-primary"></i> Location *</label>
                        <input type="text" class="form-control" id="location" name="location" value="{{ location or '' }}" placeholder="e.g., Addis Ababa, Ethiopia" required>
                    </div>
                    <div class="col-md-6">
                        <label for="salary" class="form-label"><i class="fas fa-dollar-sign me-1 text-primary"></i> Salary</label>
                        <input type="text" class="form-control" id="salary" name="salary" value="{{ salary or '' }}" placeholder="e.g., $50k - $70k or Negotiable">
                    </div>
                    <div class="col-md-6">
                        <label for="job_type" class="form-label"><i class="fas fa-clock me-1 text-primary"></i> Job Type *</label>
                        <select class="form-select" id="job_type" name="job_type" required>
                            <option value="">-- Select --</option>
                            <option value="Full-time" {% if job_type == 'Full-time' %}selected{% endif %}>Full-time</option>
                            <option value="Part-time" {% if job_type == 'Part-time' %}selected{% endif %}>Part-time</option>
                            <option value="Contract" {% if job_type == 'Contract' %}selected{% endif %}>Contract</option>
                            <option value="Remote" {% if job_type == 'Remote' %}selected{% endif %}>Remote</option>
                            <option value="Internship" {% if job_type == 'Internship' %}selected{% endif %}>Internship</option>
                        </select>
                    </div>
                    <div class="col-md-6">
                        <label for="category" class="form-label"><i class="fas fa-tag me-1 text-primary"></i> Category *</label>
                        <input type="text" class="form-control" id="category" name="category" value="{{ category or '' }}" placeholder="e.g., IT, Marketing, Education" required>
                    </div>
                    <div class="col-12">
                        <label for="description" class="form-label"><i class="fas fa-align-left me-1 text-primary"></i> Description *</label>
                        <textarea class="form-control" id="description" name="description" rows="6" placeholder="Describe the role, responsibilities, and what you're looking for..." required>{{ description or '' }}</textarea>
                    </div>
                    <div class="col-12">
                        <label for="requirements" class="form-label"><i class="fas fa-list-check me-1 text-primary"></i> Requirements</label>
                        <textarea class="form-control" id="requirements" name="requirements" rows="4" placeholder="Qualifications, skills, experience needed...">{{ requirements or '' }}</textarea>
                    </div>
                </div>

                <div class="d-flex gap-2 flex-wrap mt-4">
                    <button type="submit" class="btn btn-primary flex-fill py-3">
                        <i class="fas fa-check me-1"></i> Post Job
                    </button>
                    <a href="{{ url_for('my_jobs') }}" class="btn btn-secondary flex-fill py-3">
                        Cancel
                    </a>
                </div>
            </form>
        </div>
    </div>
{% endblock %}
